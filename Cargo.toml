[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/antonsynd/sabiko"
rust-version = "1.85"

[workspace.dependencies]
sabiko_span = { path = "crates/sabiko_span" }
sabiko_diagnostics = { path = "crates/sabiko_diagnostics" }
sabiko_lexer = { path = "crates/sabiko_lexer" }
sabiko_ast = { path = "crates/sabiko_ast" }
sabiko_parser = { path = "crates/sabiko_parser" }
sabiko_resolve = { path = "crates/sabiko_resolve" }
sabiko_types = { path = "crates/sabiko_types" }
sabiko_mir = { path = "crates/sabiko_mir" }
sabiko_borrowck = { path = "crates/sabiko_borrowck" }
sabiko_codegen = { path = "crates/sabiko_codegen" }
sabiko_driver = { path = "crates/sabiko_driver" }
sabiko_testgen = { path = "crates/sabiko_testgen" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `assert!(x.is_empty())` reads better than the `assert_eq!(x, [])` the lint wants; tests
# that need the contents on failure add a message instead.
assert_is_empty = "allow"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

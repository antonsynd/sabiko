# cargo-mutants configuration (https://mutants.rs). Run through `scripts/mutants.sh`,
# which mutates one crate at a time in place (`--in-place`, which runs one job at a time:
# the sabikoc run-pass and run-time differential tests locate the .NET toolchain under
# `tools/` relative to the source tree, so a copy of the tree would skip them) and narrows
# `--test-package` to the suites that exercise that crate:
#   sabiko_borrowck -> sabiko_borrowck (hand-built MIR tests) + sabiko_driver (UI, differential)
#   sabiko_types    -> sabiko_driver (UI typeck fixtures) + sabiko_mir (MIR snapshots, validator corpus)
#   sabiko_codegen  -> sabiko_codegen (IL snapshots) + sabikoc (run-pass, run-time differential)
#                      + sabiko_driver (UI fixtures under tests/ui/codegen, which run the backend)
# A bare `cargo mutants -p <crate>` falls back to the union below.
test_package = [
    "sabiko_borrowck",
    "sabiko_types",
    "sabiko_codegen",
    "sabiko_mir",
    "sabiko_driver",
    "sabikoc",
]

# A bare `cargo mutants` derives the test timeout from its baseline test run, which only
# tests the mutated package (`-p`), not the `--test-package` suites: far too short for the
# sabikoc and sabiko_driver suites, so `scripts/mutants.sh` passes an explicit `--timeout`
# (its `test_timeout`) instead and these two settings only apply to bare runs.
timeout_multiplier = 3.0
minimum_test_timeout = 60
build_timeout_multiplier = 3.0
# Match `-j 2` on a four-core runner.
additional_cargo_test_args = ["--", "--test-threads=2"]
# CI sets `RUSTFLAGS=-D warnings`; a mutant that leaves a variable unused must still build.
cap_lints = true

# Not worth mutating: Debug/Display impls, place/type pretty printers and diagnostic
# wording helpers (their output is pinned by the UI `.stderr` goldens anyway).
exclude_re = [
    "<impl (Debug|Display) for ",
    "::fmt -> ",
    "::describe -> String",
    "describe_place -> String",
    "Ty::display -> String",
    "ConstValue::render -> String",
    "Mutability::prefix_str -> ",
    "UseKind::(noun|verb) -> ",
    "::make_mutable_help -> String",
    # `next += 1` as `next *= 1` in a worklist loop (`while next < list.len()`) keeps
    # `next` at 0: the backend emits the first entry forever and its output grows until
    # the machine runs out of memory, which took down a nightly runner (run 19) once the
    # test timeout was long enough to let it. Any test that emits a drop glue, an inline
    # array or a by-ref tuple struct would hang, so these are killed, not survivors.
    "replace \\+= with \\*= in Cx<'_>::(drop_glues|inline_array_structs|byref_tuple_structs)$",
    # sabiko_codegen: equivalent mutants (#142), each argued in docs/TESTING.md, Mutation
    # testing (nightly run 26). Defensive code for MIR shapes the builder does not produce:
    # the use counts of `stackable_locals` for places that are never also defined once and
    # read once as a whole local (`in_place` literals, a call written into a projection,
    # a dropped place, an index temporary, a cleanup's places and flags); the return place
    # kept on the stack (`stackable_def`, `block`), `switchInt` values that are never 128-bit
    # nor non-integer (`terminator`), `ldloc`'s early truncation, and a struct or variant
    # literal whose operands read its destination. A mutant's name holds only the file,
    # line, column, mutation and function, so each pattern names the function and the
    # mutation, and a column where two mutations of one function read alike. An edit to
    # one of these functions can move what a column matches: re-list the excluded set
    # (`cargo mutants --list` with and without `--no-config`) whenever they change.
    # `scripts/mutants.sh` prints it at the start of every run.
    "sabiko_codegen/src/func\\.rs:\\d+:33: replace && with \\|\\| in stackable_locals$",
    "sabiko_codegen/src/func\\.rs:\\d+:54: replace \\+= with [-*]= in stackable_locals$",
    "sabiko_codegen/src/func\\.rs:\\d+:\\d+: delete match arm TerminatorKind::Drop\\{place, \\.\\.\\} in stackable_locals$",
    "sabiko_codegen/src/func\\.rs:\\d+:78: replace \\+= with \\*= in stackable_locals$",
    "sabiko_codegen/src/func\\.rs:\\d+:30: replace \\+= with \\*= in stackable_locals$",
    "sabiko_codegen/src/func\\.rs:\\d+:34: replace \\+= with \\*= in stackable_locals$",
    "sabiko_codegen/src/func\\.rs:\\d+:\\d+: replace && with \\|\\| in FnCx<'_, '_>::stackable_def$",
    "sabiko_codegen/src/func\\.rs:\\d+:17: replace && with \\|\\| in FnCx<'_, '_>::block$",
    "sabiko_codegen/src/func\\.rs:\\d+:\\d+: replace match guard types::stack_width\\(p\\) == StackWidth::Wide with false in FnCx<'_, '_>::terminator$",
    "sabiko_codegen/src/func\\.rs:\\d+:\\d+: replace match guard p\\.is_integer\\(\\) with true in FnCx<'_, '_>::terminator$",
    "sabiko_codegen/src/func\\.rs:\\d+:23: replace \\+ with \\* in FnCx<'_, '_>::ldloc$",
    "sabiko_codegen/src/func\\.rs:\\d+:\\d+: replace match guard !reads_dest with true in FnCx<'_, '_>::(aggregate|variant_aggregate)$",
    # sabiko_types: equivalent mutants (#125). Each is argued in docs/TESTING.md, Mutation
    # testing: run 23's list and run 25's. They change no program's diagnostics, MIR or IL,
    # so they are excluded rather than counted as survivors. The patterns name the file and
    # the mutation but not the line, so they survive edits elsewhere in the file; a pattern
    # that stops matching (code removed or rewritten) only brings the mutant back. Check a
    # change here with `cargo mutants --list -p sabiko_types` before and after.
    # Run 23's list: guards only programs the type checker rejects reach, bits that never
    # overlap, a parenthesised callee's unused type, `!` coercing to anything, and the
    # older pattern-checking survivors.
    "sabiko_types/src/check\\.rs:\\d+:\\d+: replace match guard !mutable with true in FnCtxt<'a>::check_pat_in_mode$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: replace match guard self\\.resolve\\.def\\(ctor\\)\\.kind == DefKind::Variant with true in FnCtxt<'a>::check_pat_in_mode$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: delete match arm Some\\(Res::Def\\(def\\)\\) in FnCtxt<'a>::check_pat_in_mode$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: replace match guard self\\.resolve\\.def\\(def\\)\\.kind == DefKind::Struct with true in FnCtxt<'a>::check_pat_in_mode$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: replace > with >= in FnCtxt<'a>::peel_pat_refs$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: delete ! in FnCtxt<'a>::check_call$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: delete match arm \\(_, Ty::Never\\) in FnCtxt<'a>::check_if$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: replace > with >= in rest_positions$",
    "sabiko_types/src/consts\\.rs:\\d+:\\d+: replace match guard access\\.autoderefs == 0 && access\\.index < elems\\.len\\(\\) with true in Evaluator<'a, 'b, 'c>::eval_kind$",
    "sabiko_types/src/consts\\.rs:\\d+:\\d+: replace && with \\|\\| in Evaluator<'a, 'b, 'c>::eval_kind$",
    "sabiko_types/src/consts\\.rs:\\d+:\\d+: replace < with <= in Evaluator<'a, 'b, 'c>::eval_kind$",
    "sabiko_types/src/consts\\.rs:\\d+:56: replace \\| with \\^ in binary$",
    "sabiko_types/src/consts\\.rs:\\d+:\\d+: replace match guard op\\.is_comparison\\(\\) with true in binary$",
    "sabiko_types/src/consts\\.rs:\\d+:\\d+: replace \\| with \\^ in sign_extend$",
    "sabiko_types/src/consts\\.rs:\\d+:31: replace match guard p\\.is_integer\\(\\) with true in cast$",
    "sabiko_types/src/patterns\\.rs:\\d+:\\d+: replace match guard self\\.resolve\\.def\\(def\\)\\.kind == DefKind::Const with true in PatValues<'_, '_>::value$",
    "sabiko_types/src/patterns\\.rs:\\d+:\\d+: delete match arm \\(ConstValue::Float\\(x\\), ConstValue::Float\\(y\\)\\) in compare$",
    "sabiko_types/src/patterns\\.rs:\\d+:\\d+: replace < with <= in Exhaustive<'_, '_>::lower_kind$",
    "sabiko_types/src/usefulness\\.rs:\\d+:\\d+: replace < with <= in IntRange::intersection$",
    "sabiko_types/src/usefulness\\.rs:\\d+:\\d+: replace match guard matches!\\(&\\*self\\.adt\\(\\*def\\), AdtShape::Enum \\{ \\.\\. \\}\\) with true in Checker<'a>::lower$",
    "sabiko_types/src/usefulness\\.rs:\\d+:\\d+: replace < with > in Checker<'a>::lower$",
    # Run 25's list: guards whose operands always hold (`unify` and `walk` see only the
    # blocks' own parameters); a fall-through that gives the same answer; a fast path; a
    # plain constant evaluated as a trait one. (`Ty::is_copy` and `may_be_copy_like`'s
    # `Array` arm were here; a unit test and a run-time program kill them since #142.)
    "sabiko_types/src/check\\.rs:\\d+:\\d+: replace && with \\|\\| in FnCtxt<'a>::adt_args$",
    "sabiko_types/src/check\\.rs:\\d+:\\d+: delete match arm Ty::Infer\\(_\\) in FnCtxt<'a>::may_be_copy_like$",
    "sabiko_types/src/patterns\\.rs:\\d+:\\d+: replace match guard crate::consts::is_assoc_const\\(self\\.resolve, def\\) with true in PatValues<'_, '_>::value$",
    "sabiko_types/src/traits\\.rs:\\d+:\\d+: replace \\+ with \\* in ItemTypes::builtin_impl$",
    "sabiko_types/src/traits\\.rs:\\d+:\\d+: replace match guard vars\\.contains\\(p\\) with true in walk$",
    "sabiko_types/src/traits\\.rs:\\d+:\\d+: replace match guard vars\\.contains\\(p\\) with true in unify$",
    "sabiko_types/src/traits\\.rs:\\d+:\\d+: replace match guard vars\\.contains\\(q\\) with true in unify$",
    "sabiko_types/src/ty\\.rs:\\d+:\\d+: replace \\|\\| with && in Ty::subst$",
    # #142: the trait's default `generics` already returns an empty vector.
    "sabiko_types/src/usefulness\\.rs:\\d+:\\d+: replace PatCx::generics -> Vec<DefId> with vec!\\[\\]$",
]

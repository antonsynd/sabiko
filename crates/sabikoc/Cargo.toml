[package]
name = "sabikoc"
description = "The Sabiko compiler: a Rust-inspired, borrow-checked language for .NET"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sabikoc"
path = "src/main.rs"

[dependencies]
sabiko_driver = { workspace = true }
sabiko_diagnostics = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
sabiko_testgen = { workspace = true }

[lints]
workspace = true

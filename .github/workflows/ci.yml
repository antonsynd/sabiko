name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  dotnet-spike:
    name: IL spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify
        run: scripts/setup-dotnet.sh
      - name: Assemble, verify and run the spike
        run: scripts/check-spike.sh

  dotnet-spike-windows:
    name: IL spike (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify
        run: scripts/setup-dotnet.ps1
      - name: Assemble, verify and run the spike
        shell: pwsh
        run: |
          . tools\env.ps1
          New-Item -ItemType Directory -Force target\il\hello | Out-Null
          ilasm -quiet -exe -output:target\il\hello\hello.dll spike\hello.il
          ilverify target\il\hello\hello.dll
          Copy-Item spike\hello.runtimeconfig.json target\il\hello\hello.runtimeconfig.json
          $actual = dotnet target\il\hello\hello.dll
          $expected = Get-Content spike\expected.txt
          if (Compare-Object $actual $expected) { Write-Error 'spike output mismatch'; exit 1 }
          Write-Host 'spike: ok'

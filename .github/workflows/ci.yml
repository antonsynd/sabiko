name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The run-pass tests need the .NET toolchain under tools/; fail instead of skipping without it.
      SABIKO_REQUIRE_DOTNET: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        if: runner.os != 'Windows'
        run: scripts/setup-dotnet.sh
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        if: runner.os == 'Windows'
        run: scripts/setup-dotnet.ps1
      - name: Assemble, verify and run the IL spike and the runtime probes
        if: runner.os != 'Windows'
        run: |
          scripts/check-spike.sh
          scripts/check-runtime.sh
      - name: Assemble, verify and run the IL spike and the runtime probes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . tools\env.ps1
          New-Item -ItemType Directory -Force target\il\hello | Out-Null
          ilasm -quiet -exe -output:target\il\hello\hello.dll spike\hello.il
          ilverify target\il\hello\hello.dll
          Copy-Item spike\hello.runtimeconfig.json target\il\hello\hello.runtimeconfig.json
          $actual = dotnet target\il\hello\hello.dll
          $expected = Get-Content spike\expected.txt
          if (Compare-Object $actual $expected) { Write-Error 'spike output mismatch'; exit 1 }
          Write-Host 'spike: ok'
          scripts\check-runtime.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      # The benchmarks run nightly; this keeps the harness from rotting in between: its
      # unit tests, then every build and measurement path once with tiny sample counts.
      - name: Benchmark harness (unit tests and a smoke run)
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*.py'
          python3 benchmarks/run_benchmarks.py --smoke fibonacci --json target/bench-smoke/results.json --markdown target/bench-smoke/report.md
          python3 benchmarks/allocation_gate.py check --results target/bench-smoke/results.json

  # The same suite on the .NET 11 toolchain, which `scripts/setup-env.sh` installs by
  # default (decision 88). ILVerify 11 is stricter than 10 (it rejects TypeSpecs that
  # ECMA-335 II.23.2.14 does not allow), so this job catches IL the main matrix would pass.
  # fmt and clippy do not depend on .NET and run in the matrix above.
  dotnet11:
    name: rust (ubuntu-latest, .NET 11)
    runs-on: ubuntu-latest
    env:
      SABIKO_REQUIRE_DOTNET: 1
      # Exact version of the runtime, ilasm, ILVerify and reference-assembly packages.
      SABIKO_DOTNET_VERSION: 11.0.0
      # sabikoc emits net10.0 programs; run them on the newest runtime (11), not on the
      # runner image's .NET 10, as tools/env.sh does (the tests do not source it).
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        run: scripts/setup-dotnet.sh
      - name: Assemble, verify and run the IL spike and the runtime probes
        run: |
          scripts/check-spike.sh
          scripts/check-runtime.sh
      - run: cargo build --workspace
      - run: cargo test --workspace

  # Dependency licences, banned or duplicated crates and crate sources (`deny.toml`). The
  # dependency graph is the same on every OS, so one runner checks it. Advisories run in
  # the nightly workflow instead, so a new RUSTSEC entry cannot turn a pull request red
  # (decision 45).
  deny:
    name: cargo-deny (licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        # The workflow's `-D warnings` is for this repository's code, not for the tool's.
        env:
          RUSTFLAGS: ''
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check licenses bans sources

# Weekly benchmark trend: runs the Sabiko vs C# benchmarks (benchmarks/README.md), appends
# the p50s to benchmarks/results/history.json, redraws benchmarks/results/trend.svg and
# commits both to the branch it ran on (decision 68). The nightly `benchmarks` job still
# runs every night for the allocation gate and commits nothing; this one records a point a
# week, so the history grows by one line a week instead of one bot commit a night.
name: Benchmark trend

on:
  schedule:
    - cron: '41 5 * * 1'  # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write

# Two runs at once would race on history.json.
concurrency:
  group: benchmark-trend
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  record:
    name: record (Sabiko vs C# benchmarks, weekly point)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        run: scripts/setup-dotnet.sh
      - name: Run the benchmarks
        run: >
          python3 benchmarks/run_benchmarks.py
          --json bench-out/results.json --markdown bench-out/report.md
          --machine-label "GitHub Actions ubuntu-latest (shared runner)"
      - name: Publish the report to the job summary
        run: cat bench-out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record the run and redraw the chart
        run: |
          python3 benchmarks/trend.py record --results bench-out/results.json --commit "$GITHUB_SHA"
          python3 benchmarks/trend.py chart
          { echo '## Trend'; echo; echo "history.json now holds $(grep -c '"date"' benchmarks/results/history.json) runs."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-trend-results
          path: |
            bench-out/
            benchmarks/results/history.json
            benchmarks/results/trend.svg
          if-no-files-found: warn
          retention-days: 90
      - name: Commit history.json and trend.svg
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/history.json benchmarks/results/trend.svg
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Record the weekly benchmark trend ($(date -u +%Y-%m-%d))"
          # Someone may have pushed while the benchmarks ran; only the bot writes these files.
          for attempt in 1 2 3 4; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

# Nightly soak: a fuzzing budget over the whole pipeline and the property tests at a much
# higher case count than a PR run can afford. Any crash is a compiler bug: the reproducer
# is uploaded as a workflow artifact and the job fails.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (libFuzzer, nightly toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build the fuzz targets
        run: cd fuzz && cargo fuzz build
      # Every target runs even after an earlier one crashes (`if: always()`), so one
      # night reports every bug it found; the job still fails because a step failed.
      - name: Fuzz the whole pipeline on arbitrary text
        run: scripts/fuzz.sh pipeline 600
      - name: Fuzz the parser
        if: always()
        run: scripts/fuzz.sh parse 300
      - name: Fuzz the whole pipeline on generated programs
        if: always()
        run: scripts/fuzz.sh pipeline_structured 600
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  properties:
    name: properties (proptest, high case count)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
      # The run-pass, differential and snapshot verification tests need the .NET
      # toolchain under tools/; fail instead of skipping without it.
      SABIKO_REQUIRE_DOTNET: 1
      # Property tests read these to scale up; a PR run uses the small defaults.
      PROPTEST_CASES: 4096
      # The PR run uses a fixed seed so a bug found by chance cannot make a PR red;
      # the nightly run explores.
      PROPTEST_RNG_SEED: random
      SABIKO_GENERATED_SEEDS: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        run: scripts/setup-dotnet.sh
      - run: cargo test --workspace

  # PLACEHOLDER: `mutants` job (cargo-mutants on sabiko_borrowck and sabiko_types with a
  # recorded mutation score) goes here; see docs/PLAN.md Phase 10 "Verification".

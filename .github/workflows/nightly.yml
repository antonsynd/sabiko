# Nightly soak: a fuzzing budget over the whole pipeline and the property tests at a much
# higher case count than a PR run can afford, mutation testing, the RustSec advisory check,
# and the runtime/memory benchmarks against C# (benchmarks/README.md). Any crash is a
# compiler bug: the reproducer is uploaded as a workflow artifact and the job fails.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (libFuzzer, nightly toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # `+nightly`: rust-toolchain.toml pins the stable toolchain for the whole tree,
      # which overrides the default the step above installs.
      - name: Build the fuzz targets
        run: cd fuzz && cargo +nightly fuzz build
      # Every target runs even after an earlier one crashes (`if: always()`), so one
      # night reports every bug it found; the job still fails because a step failed.
      - name: Fuzz the whole pipeline on arbitrary text
        if: always()
        run: scripts/fuzz.sh pipeline 600
      - name: Fuzz the parser
        if: always()
        run: scripts/fuzz.sh parse 300
      - name: Fuzz the whole pipeline on generated programs
        if: always()
        run: scripts/fuzz.sh pipeline_structured 600
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  properties:
    name: properties (proptest, high case count)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
      # The run-pass, differential and snapshot verification tests need the .NET
      # toolchain under tools/; fail instead of skipping without it.
      SABIKO_REQUIRE_DOTNET: 1
      # Property tests read these to scale up; a PR run uses the small defaults.
      PROPTEST_CASES: 4096
      # The PR run uses a fixed seed so a bug found by chance cannot make a PR red;
      # the nightly run explores.
      PROPTEST_RNG_SEED: random
      SABIKO_GENERATED_SEEDS: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        run: scripts/setup-dotnet.sh
      - run: cargo test --workspace

  # RustSec advisories against the dependency graph (`deny.toml`). Nightly rather than per
  # push (decision 45): a new advisory is news about a dependency, not about the change
  # under review, and should not fail unrelated pull requests.
  advisories:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check advisories

  # Runtime and memory of Sabiko-compiled programs against the same programs in C# (and
  # rustc for reference); see benchmarks/README.md. The report goes to the job summary and,
  # with the raw samples, to an artifact; nothing is committed. Only allocations are gated:
  # they are exact, while timings on a shared runner are too noisy to fail a build on.
  benchmarks:
    name: benchmarks (Sabiko vs C#, runtime and memory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        run: scripts/setup-dotnet.sh
      - name: Run the benchmarks
        run: >
          python3 benchmarks/run_benchmarks.py
          --json bench-out/results.json --markdown bench-out/report.md
          --machine-label "GitHub Actions ubuntu-latest (shared runner)"
      - name: Publish the report to the job summary
        if: always()
        run: if [ -f bench-out/report.md ]; then cat bench-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Allocation gate (fails on a >10% increase over benchmarks/allocation-baseline.json)
        run: |
          status=0
          python3 benchmarks/allocation_gate.py check --results bench-out/results.json > bench-out/gate.txt 2>&1 || status=$?
          cat bench-out/gate.txt
          { echo '## Allocation gate'; echo '```'; cat bench-out/gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-out/
          if-no-files-found: warn
          retention-days: 90

  mutants:
    name: mutation testing (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        crate: [sabiko_borrowck, sabiko_codegen, sabiko_types]
    env:
      CARGO_TERM_COLOR: always
      # The run-pass and run-time differential tests must run, not skip, so a missing
      # toolchain fails the baseline instead of silently lowering the codegen score.
      SABIKO_REQUIRE_DOTNET: 1
      SABIKO_REQUIRE_RUSTC: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ilasm, ildasm, ILVerify, csc and build Sabiko.Runtime
        run: scripts/setup-dotnet.sh
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Mutation testing (scripts/mutants.sh enforces the per-crate minimum score)
        run: scripts/mutants.sh ${{ matrix.crate }}
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.crate }}
          path: target/mutants/${{ matrix.crate }}/mutants.out
          if-no-files-found: warn
